<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TECHIE SHIV — Premium Creator Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  cursor:none!important;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:'Inter',sans-serif;
  background:#030712;
  color:white;
  overflow-x:hidden;
}

:root{
  --pink:#ff4fd8;
  --purple:#a855f7;
  --blue:#3b82f6;
  --muted:#9ca3af;
}

/* PREMIUM CURSOR */

#cursor-dot{
  width:10px;
  height:10px;
  background:#ffffff;
  border-radius:50%;
  position:fixed;
  top:0;
  left:0;
  transform:translate(-50%,-50%);
  pointer-events:none;
  z-index:999999;
  box-shadow:
  0 0 10px rgba(255,255,255,.9),
  0 0 25px rgba(255,79,216,.8),
  0 0 45px rgba(168,85,247,.7);
}

#cursor-ring{
  width:42px;
  height:42px;
  border:2px solid rgba(255,255,255,.25);
  border-radius:50%;
  position:fixed;
  top:0;
  left:0;
  transform:translate(-50%,-50%);
  pointer-events:none;
  z-index:999998;
  transition:
  width .25s ease,
  height .25s ease,
  background .25s ease,
  border .25s ease,
  transform .08s ease;
  backdrop-filter:blur(4px);
}

#cursor-ring.active{
  width:78px;
  height:78px;
  border:2px solid rgba(255,79,216,.9);
  background:rgba(255,79,216,.08);
  box-shadow:
  0 0 30px rgba(255,79,216,.35),
  0 0 60px rgba(168,85,247,.18);
}

#cursor-ring.click{
  transform:translate(-50%,-50%) scale(.82);
}

/* NAVBAR */

nav{
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:72px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 60px;
  background:rgba(3,7,18,.82);
  backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(255,255,255,.05);
  z-index:1000;
}

.logo{
  font-size:34px;
  font-weight:900;
}

.logo span{
  color:var(--pink);
}

.nav-links{
  display:flex;
  gap:30px;
}

.nav-links a{
  text-decoration:none;
  color:#9ca3af;
  transition:.3s;
}

.nav-links a:hover{
  color:white;
}

/* HERO */

.hero{
  min-height:100vh;
  padding:130px 70px 90px;
  position:relative;
}

.hero::before{
  content:'';
  width:700px;
  height:700px;
  position:absolute;
  right:-250px;
  top:50%;
  transform:translateY(-50%);
  background:radial-gradient(circle,rgba(168,85,247,.18),transparent 70%);
}

.hero-inner{
  max-width:1350px;
  margin:auto;
  display:grid;
  grid-template-columns:1fr auto;
  gap:70px;
  align-items:center;
}

.eyebrow{
  display:inline-flex;
  align-items:center;
  gap:10px;
  padding:12px 18px;
  border-radius:999px;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.08);
  margin-bottom:28px;
}

.live-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#00ff9d;
  box-shadow:0 0 10px #00ff9d;
}

.hero h1{
  font-size:95px;
  line-height:.96;
  font-weight:900;
  margin-bottom:26px;
}

.gradient{
  background:linear-gradient(90deg,var(--pink),var(--purple));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.hero-sub{
  font-size:21px;
  line-height:1.8;
  color:var(--muted);
  margin-bottom:40px;
}

.hero-btns{
  display:flex;
  gap:18px;
  flex-wrap:wrap;
}

.btn{
  padding:18px 34px;
  border-radius:22px;
  text-decoration:none;
  font-weight:800;
  color:white;
  transition:.35s cubic-bezier(.34,1.56,.64,1);
}

.btn:hover,
.social-btn:hover,
.card:hover,
.service:hover,
.audience-card:hover,
.name-pill:hover,
.email-btn:hover{
  transform:scale(1.07) translateY(-4px);
  box-shadow:0 18px 40px rgba(255,79,216,.18);
}

.primary{
  background:linear-gradient(135deg,var(--pink),var(--purple));
}

.secondary{
  background:#101827;
  border:1px solid rgba(255,255,255,.08);
}

/* SOCIALS */

.socials{
  display:flex;
  gap:22px;
  flex-wrap:wrap;
  margin-top:28px;
  align-items:center;
}

.social-btn{
  min-width:230px;
  height:76px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:14px;
  border-radius:24px;
  text-decoration:none;
  color:white;
  font-weight:800;
  font-size:20px;
  transition:.35s cubic-bezier(.34,1.56,.64,1);
  box-shadow:0 10px 25px rgba(0,0,0,.18);
}

.social-btn i{
  font-size:28px;
}

.social-btn:hover{
  transform:translateY(-5px) scale(1.05);
}

.instagram{
  background:linear-gradient(135deg,#f09433,#dc2743,#bc1888);
}

.youtube{
  background:linear-gradient(135deg,#ff0033,#ff4d4d);
}

.telegram{
  background:linear-gradient(135deg,#229ED9,#5cc8ff);
}

/* PROFILE */

.hero-right{
  position:relative;
}

.photo-wrap{
  width:430px;
  height:430px;
  position:relative;
}

.photo-ring{
  width:100%;
  height:100%;
  border-radius:50%;
  padding:7px;
  background:linear-gradient(135deg,var(--pink),var(--purple));
}

.photo-inner{
  width:100%;
  height:100%;
  border-radius:50%;
  overflow:hidden;
  border:8px solid #030712;
}

.photo-inner img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.stat-card{
  position:absolute;
  background:rgba(17,24,39,.94);
  border:1px solid rgba(255,255,255,.08);
  border-radius:22px;
  padding:10px 12px;
  display:flex;
  align-items:center;
  gap:10px;
  backdrop-filter:blur(12px);
  animation:floating 4s ease-in-out infinite;
  z-index:5;
}

@keyframes floating{
  0%{transform:translateY(0)}
  50%{transform:translateY(-10px)}
  100%{transform:translateY(0)}
}

.top-card{
  top:35px;
  left:-45px;
}

.bottom-card{
  bottom:60px;
  right:-45px;
}

.icon{
  width:48px;
  height:48px;
  border-radius:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
}

.blue{
  background:linear-gradient(135deg,#3b82f6,#06b6d4);
}

.purple{
  background:linear-gradient(135deg,#a855f7,#ec4899);
}

.stat-label{
  font-size:13px;
  color:#c3c7d1;
  font-weight:600;
}

.stat-val{
  font-size:24px;
  font-weight:900;
}

.name-pill{
  margin-top:24px;
  text-align:center;
  padding:22px 42px;
  border-radius:999px;
  background:#111827;
  border:1px solid rgba(255,255,255,.08);
  font-size:30px;
  font-weight:900;
  letter-spacing:1px;
  color:white;
  text-shadow:
  0 0 12px rgba(255,255,255,.45),
  0 0 22px rgba(255,79,216,.35),
  0 0 42px rgba(168,85,247,.25);
  box-shadow:
  0 0 24px rgba(255,79,216,.12);
  transition:.35s;
}

/* SECTIONS */

section{
  padding:100px 70px;
}

.container{
  max-width:1300px;
  margin:auto;
}

.sec-tag{
  color:var(--pink);
  font-weight:700;
  margin-bottom:12px;
  display:block;
}

.sec-title{
  font-size:58px;
  margin-bottom:18px;
}

.sec-sub{
  color:var(--muted);
  line-height:1.8;
  max-width:720px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:24px;
  margin-top:50px;
}

.card,
.service,
.audience-card{
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.08);
  border-radius:24px;
  padding:30px;
  transition:.35s cubic-bezier(.34,1.56,.64,1);
}

.card p,
.service p,
.audience-card p{
  color:#9ca3af;
  line-height:1.8;
}

.big{
  font-size:52px;
  font-weight:900;
  margin-top:12px;
}

.review{
  color:#ffc83d;
  margin-bottom:16px;
}

.handle{
  margin-top:18px;
  color:var(--pink);
  font-weight:700;
}

/* CONTACT */

.contact-wrapper{
  display:flex;
  justify-content:center;
  margin-top:40px;
}

.email-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:20px 38px;
  border-radius:24px;
  background:linear-gradient(135deg,var(--pink),var(--purple));
  color:white;
  text-decoration:none;
  font-weight:800;
  transition:.35s cubic-bezier(.34,1.56,.64,1);
}

/* FOOTER */

footer{
  padding:50px 20px;
  text-align:center;
  border-top:1px solid rgba(255,255,255,.06);
  color:#9ca3af;
}

/* RESPONSIVE */

@media(max-width:980px){

nav{
  padding:0 20px;
}

.nav-links{
  display:none;
}

.hero{
  padding:120px 20px 70px;
}

.hero-inner{
  grid-template-columns:1fr;
  text-align:center;
}

.hero h1{
  font-size:58px;
}

.hero-sub{
  font-size:18px;
}

.hero-btns,
.socials{
  justify-content:center;
}

.photo-wrap{
  width:310px;
  height:310px;
}

.top-card{
  left:-10px;
}

.bottom-card{
  right:-10px;
}

section{
  padding:80px 20px;
}

.sec-title{
  font-size:40px;
}

.name-pill{
  font-size:22px;
}

.social-btn{
  min-width:100%;
}

}

</style>
</head>

<body>

<div id="cursor-dot"></div>
<div id="cursor-ring"></div>

<!-- YOUR REMAINING HTML SAME AS BEFORE -->

<script>

const dot = document.getElementById("cursor-dot");
const ring = document.getElementById("cursor-ring");

let mouseX = window.innerWidth / 2;
let mouseY = window.innerHeight / 2;

let ringX = mouseX;
let ringY = mouseY;

document.addEventListener("mousemove",(e)=>{

mouseX = e.clientX;
mouseY = e.clientY;

dot.style.left = mouseX + "px";
dot.style.top = mouseY + "px";

});

/* Smooth Ring Animation */

function animateCursor(){

ringX += (mouseX - ringX) * 0.12;
ringY += (mouseY - ringY) * 0.12;

ring.style.left = ringX + "px";
ring.style.top = ringY + "px";

requestAnimationFrame(animateCursor);

}

animateCursor();

/* Hover Detection */

const hoverItems = document.querySelectorAll(
'.btn,.social-btn,.card,.service,.audience-card,.name-pill,.stat-card,.email-btn,a'
);

hoverItems.forEach(item=>{

item.addEventListener("mouseenter",()=>{

ring.classList.add("active");

});

item.addEventListener("mouseleave",()=>{

ring.classList.remove("active");

});

});

/* Click Animation */

document.addEventListener("mousedown",()=>{

ring.classList.add("click");

});

document.addEventListener("mouseup",()=>{

ring.classList.remove("click");

});

</script>

</body>
</html>
